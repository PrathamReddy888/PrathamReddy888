<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="64" viewBox="0 0 260 64" role="img" aria-label="All repositories button">
  <g font-family="monospace">
    <rect x="10" y="10" width="250" height="54" rx="12" fill="#B0B0B0"/>
    <rect x="0" y="0" width="250" height="54" rx="12" fill="#000000" stroke="#3D3D3D" stroke-width="1.5"/>
    <rect x="1.5" y="1.5" width="247" height="51" rx="10.5" fill="none" stroke="#7D7D7D" stroke-width="1" stroke-dasharray="6 8" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="20" cy="27" r="3.5" fill="#B0B0B0">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="26" font-size="13" font-weight="bold" letter-spacing="2" fill="#B0B0B0">ALL REPOSITORIES</text>
    <text x="34" y="44" font-size="8.5" letter-spacing="1.5" fill="#7D7D7D">36 PUBLIC · GITHUB.COM</text>
    <text x="236" y="31" text-anchor="end" font-size="14" font-weight="bold" fill="#B0B0B0">▸</text>
  </g>
