<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="350" viewBox="0 0 850 350" role="img" aria-label="Pratham Reddy identity plate: portrait, name, live status, signal radar">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#191A20" stroke-width="1" stroke-dasharray="7 19"/>
    </pattern>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.93  0 0 0 0 0.95  0 0 0 0.05 0"/>
    </filter>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00FFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00FFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00FFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plateClip"><rect x="5" y="5" width="840" height="340" rx="24"/></clipPath>
    <clipPath id="avClip"><rect x="39" y="74" width="176" height="176" rx="12"/></clipPath>
    <clipPath id="typeClip">
      <rect x="270" y="208" width="0" height="20">
        <animate attributeName="width" values="0;0;310;310;0;0" keyTimes="0;0.05;0.4;0.86;0.93;1" dur="9s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <g font-family="'Cascadia Mono','JetBrains Mono',Consolas,Menlo,monospace">
    <!-- midnight concrete plate -->
    <rect x="5" y="5" width="840" height="340" rx="24" fill="#0D0D0F"/>
    <g clip-path="url(#plateClip)">
      <rect x="5" y="5" width="840" height="340" fill="url(#grid)"/>
      <rect x="5" y="5" width="840" height="340" filter="url(#grain)"/>
    </g>
    <!-- soft bezel inner light -->
    <rect x="8" y="8" width="834" height="334" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="10"/>
    <!-- status row -->
    <circle cx="29" cy="30" r="3" fill="#00FFFF" filter="url(#neon)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="34" font-size="10" letter-spacing="2.5" fill="#8A8A93">PRATHAMREDDY888 / PROFILE.SYS — ONLINE</text>
    <text x="821" y="33" text-anchor="end" font-size="9" letter-spacing="1.5" fill="#5A5A63">36 PUBLIC REPOS · 6 LANGUAGES</text>
    <rect x="29" y="48" width="792" height="1" fill="#1E1E24"/>
    <!-- portrait module · soft bezel -->
    <rect x="29" y="64" width="196" height="196" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
    <image x="39" y="74" width="176" height="176" preserveAspectRatio="xMidYMid meet" clip-path="url(#avClip)" href="data:image/png;base64,"/>
    <path d="M 45 250 L 45 256 L 51 256" fill="none" stroke="#00FFFF" stroke-width="2" opacity="0.6"/>
    <text x="127" y="286" text-anchor="middle" font-size="8.5" letter-spacing="2" fill="#5A5A63">FIG.01 — THE OPERATOR</text>
    <circle cx="99" cy="301" r="2.5" fill="#C0FF00">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="107" y="305" font-size="8" letter-spacing="1.5" fill="#8A8A93">LIVE FEED</text>
    <!-- name · machined type -->
    <g font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif" fill="#EDEDF0">
      <text x="252" y="114" font-size="54" letter-spacing="1" opacity="0">PRATHAM
        <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.7s" fill="freeze"/>
      </text>
      <text x="252" y="166" font-size="54" letter-spacing="1" opacity="0">REDDY
        <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.7s" fill="freeze"/>
      </text>
    </g>
    <text x="252" y="194" font-size="11" letter-spacing="2" fill="#8A8A93" opacity="0">@PrathamReddy888 · GITHUB · PUBLIC PROFILE
      <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.7s" fill="freeze"/>
    </text>
    <!-- typing line -->
    <text x="252" y="224" font-size="13" font-weight="bold" fill="#00FFFF">&gt;</text>
    <g clip-path="url(#typeClip)">
      <text x="270" y="224" font-size="13" fill="#EDEDF0" textLength="310" lengthAdjust="spacingAndGlyphs">systems online — streaming live activity</text>
    </g>
    <rect x="270" y="210" width="8" height="17" rx="1.5" fill="#00FFFF" filter="url(#neon)">
      <animate attributeName="x" values="270;270;580;580;270;270" keyTimes="0;0.05;0.4;0.86;0.93;1" dur="9s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>
    <!-- stat tiles · numbers fade in once -->
    <rect x="252" y="248" width="180" height="88" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
    <rect x="270" y="252" width="36" height="2.5" rx="1.25" fill="url(#tileAccent)"/>
    <g font-family="'Segoe UI Black','Arial Black',Arial,sans-serif">
      <text x="342" y="300" text-anchor="middle" font-size="30" fill="#EDEDF0" opacity="0">36
        <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.8s" fill="freeze"/>
      </text>
    </g>
    <text x="342" y="324" text-anchor="middle" font-size="8.5" letter-spacing="1.5" fill="#8A8A93" opacity="0">REPOSITORIES
      <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.8s" fill="freeze"/>
    </text>
    <rect x="445" y="248" width="180" height="88" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
    <rect x="463" y="252" width="36" height="2.5" rx="1.25" fill="url(#tileAccent)"/>
    <g font-family="'Segoe UI Black','Arial Black',Arial,sans-serif">
      <text x="535" y="300" text-anchor="middle" font-size="30" fill="#EDEDF0" opacity="0">06
        <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.8s" fill="freeze"/>
      </text>
    </g>
    <text x="535" y="324" text-anchor="middle" font-size="8.5" letter-spacing="1.5" fill="#8A8A93" opacity="0">LANGUAGES
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.8s" fill="freeze"/>
    </text>
    <rect x="638" y="248" width="180" height="88" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
    <rect x="656" y="252" width="36" height="2.5" rx="1.25" fill="url(#tileAccent)"/>
    <g font-family="'Segoe UI Black','Arial Black',Arial,sans-serif">
      <text x="728" y="300" text-anchor="middle" font-size="30" fill="#EDEDF0" opacity="0">05
        <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.8s" fill="freeze"/>
      </text>
    </g>
    <text x="728" y="324" text-anchor="middle" font-size="8.5" letter-spacing="1.5" fill="#8A8A93" opacity="0">TOOLS
      <animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.8s" fill="freeze"/>
    </text>
    <!-- signal radar -->
    <circle cx="756" cy="96" r="30" fill="none" stroke="#2A2A2F" stroke-width="1.5"/>
    <circle cx="756" cy="96" r="20" fill="none" stroke="#2A2A2F" stroke-width="1"/>
    <circle cx="756" cy="96" r="10" fill="none" stroke="#2A2A2F" stroke-width="1"/>
    <circle cx="756" cy="96" r="2.5" fill="#00FFFF" filter="url(#neon)"/>
    <g>
      <line x1="756" y1="96" x2="786" y2="96" stroke="#00FFFF" stroke-width="1.5" opacity="0.85" filter="url(#neon)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 756 96" to="360 756 96" dur="6s" repeatCount="indefinite"/>
    </g>
    <circle cx="770" cy="80" r="2.8" fill="#BF00FF" filter="url(#neon)">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.25;0.55;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="756" y="146" text-anchor="middle" font-size="8" letter-spacing="2" fill="#5A5A63">SIGNAL ACTIVE</text>
    <!-- atmospheric sweep -->
    <g clip-path="url(#plateClip)">
      <rect x="0" y="5" width="130" height="340" fill="url(#scan)">
        <animateTransform attributeName="transform" type="translate" from="-160 0" to="870 0" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- bezel border + rim light -->
    <rect x="5" y="5" width="840" height="340" rx="24" fill="none" stroke="#2A2A2F" stroke-width="3"/>
    <path d="M 845 29 L 845 321 A 24 24 0 0 1 821 345 L 29 345" fill="none" stroke="url(#rim)" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
