<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="350" viewBox="0 0 850 350" role="img" aria-label="Pratham Reddy identity plate">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1C1C1C" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B0B0B0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B0B0B0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#B0B0B0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plateClip"><rect x="0" y="0" width="840" height="340" rx="14"/></clipPath>
    <clipPath id="tickerClip"><rect x="14" y="14" width="812" height="24" rx="5"/></clipPath>
    <clipPath id="avClip"><rect x="34" y="66" width="180" height="180" rx="10"/></clipPath>
    <clipPath id="typeClip">
      <rect x="262" y="172" width="0" height="26">
        <animate attributeName="width" values="0;0;316;316;0" keyTimes="0;0.06;0.5;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <g font-family="monospace">
    <!-- hard shadow -->
    <rect x="10" y="10" width="840" height="340" rx="14" fill="#B0B0B0"/>
    <!-- plate -->
    <rect x="0" y="0" width="840" height="340" rx="14" fill="#000000"/>
    <rect x="0" y="0" width="840" height="340" rx="14" fill="url(#grid)"/>
    <!-- ticker strip -->
    <rect x="14" y="14" width="812" height="24" rx="5" fill="#1C1C1C" stroke="#3D3D3D" stroke-width="1"/>
    <g clip-path="url(#tickerClip)">
      <g>
        <text x="14" y="30" font-size="10" letter-spacing="2" fill="#7D7D7D">GITHUB PERSONAL FILE // PRATHAM REDDY // 36 PUBLIC REPOSITORIES // ALL STATIONS LIVE //</text>
        <text x="1014" y="30" font-size="10" letter-spacing="2" fill="#7D7D7D">GITHUB PERSONAL FILE // PRATHAM REDDY // 36 PUBLIC REPOSITORIES // ALL STATIONS LIVE //</text>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="24s" repeatCount="indefinite"/>
      </g>
    </g>
    <rect x="14" y="44" width="812" height="1" fill="#1C1C1C"/>
    <!-- portrait module -->
    <rect x="24" y="56" width="200" height="200" rx="14" fill="#1C1C1C" stroke="#3D3D3D" stroke-width="1.5"/>
    <image x="34" y="66" width="180" height="180" preserveAspectRatio="xMidYMid meet" clip-path="url(#avClip)" href="data:image/png;base64,"/>
    <rect x="24" y="266" width="200" height="56" rx="10" fill="#1C1C1C" stroke="#3D3D3D" stroke-width="1.5"/>
    <text x="124" y="289" text-anchor="middle" font-size="9.5" font-weight="bold" letter-spacing="1.5" fill="#B0B0B0">FIG.01 — THE OPERATOR</text>
    <circle cx="92" cy="305" r="3.5" fill="#B0B0B0">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="102" y="309" font-size="8.5" letter-spacing="1.5" fill="#7D7D7D">LIVE FEED</text>
    <!-- name + handle -->
    <text x="244" y="128" font-size="42" font-weight="bold" letter-spacing="4" fill="#B0B0B0">PRATHAM REDDY
      <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
    </text>
    <text x="244" y="158" font-size="12" letter-spacing="2" fill="#7D7D7D">@PrathamReddy888 — PUBLIC PROFILE · GITHUB</text>
    <!-- typing line -->
    <text x="244" y="190" font-size="13" fill="#7D7D7D">&gt;</text>
    <g clip-path="url(#typeClip)">
      <text x="262" y="190" font-size="13" fill="#B0B0B0">systems online — streaming live activity</text>
    </g>
    <rect x="262" y="176" width="9" height="17" fill="#B0B0B0">
      <animate attributeName="x" values="262;262;578;578;262" keyTimes="0;0.06;0.5;0.92;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>
    <!-- radar -->
    <circle cx="742" cy="100" r="34" fill="none" stroke="#3D3D3D" stroke-width="1.5"/>
    <circle cx="742" cy="100" r="22" fill="none" stroke="#3D3D3D" stroke-width="1"/>
    <circle cx="742" cy="100" r="10" fill="none" stroke="#3D3D3D" stroke-width="1"/>
    <circle cx="742" cy="100" r="2.5" fill="#B0B0B0"/>
    <g>
      <line x1="742" y1="100" x2="776" y2="100" stroke="#B0B0B0" stroke-width="1.5" opacity="0.9"/>
      <animateTransform attributeName="transform" type="rotate" from="0 742 100" to="360 742 100" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="758" cy="82" r="3" fill="#B0B0B0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="742" y="146" text-anchor="middle" font-size="8.5" letter-spacing="2" fill="#7D7D7D">SIGNAL ACTIVE</text>
    <!-- stat tiles -->
    <rect x="244" y="206" width="572" height="1" fill="#1C1C1C"/>
    <rect x="244" y="222" width="181" height="76" rx="10" fill="#1C1C1C" stroke="#3D3D3D" stroke-width="1.5"/>
    <g text-anchor="middle" fill="#B0B0B0" font-size="26" font-weight="bold">
      <text x="334" y="256">00<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.22" dur="6s" repeatCount="indefinite"/></text>
      <text x="334" y="256">12<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.22;0.47" dur="6s" repeatCount="indefinite"/></text>
      <text x="334" y="256">24<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.47;0.72" dur="6s" repeatCount="indefinite"/></text>
      <text x="334" y="256">36<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.72" dur="6s" repeatCount="indefinite"/></text>
    </g>
    <text x="334" y="282" text-anchor="middle" font-size="8.5" letter-spacing="1.5" fill="#7D7D7D">REPOSITORIES</text>
    <rect x="439" y="222" width="181" height="76" rx="10" fill="#1C1C1C" stroke="#3D3D3D" stroke-width="1.5"/>
    <g text-anchor="middle" fill="#B0B0B0" font-size="26" font-weight="bold">
      <text x="529" y="256">00<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.34" dur="3.9s" repeatCount="indefinite"/></text>
      <text x="529" y="256">03<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.34;0.67" dur="3.9s" repeatCount="indefinite"/></text>
      <text x="529" y="256">06<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.67" dur="3.9s" repeatCount="indefinite"/></text>
    </g>
    <text x="529" y="282" text-anchor="middle" font-size="8.5" letter-spacing="1.5" fill="#7D7D7D">LANGUAGES</text>
    <rect x="634" y="222" width="181" height="76" rx="10" fill="#1C1C1C" stroke="#3D3D3D" stroke-width="1.5"/>
    <g text-anchor="middle" fill="#B0B0B0" font-size="26" font-weight="bold">
      <text x="724" y="256">00<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.33" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="724" y="256">02<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.33;0.66" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="724" y="256">05<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.66" dur="4.5s" repeatCount="indefinite"/></text>
    </g>
    <text x="724" y="282" text-anchor="middle" font-size="8.5" letter-spacing="1.5" fill="#7D7D7D">TOOLS</text>
    <!-- ghost status -->
    <text x="244" y="322" font-size="9" letter-spacing="2" fill="#3D3D3D">AUTH: LIVE · SECTOR: GITHUB.COM · ACCESS: PUBLIC</text>
    <!-- marching ants -->
    <rect x="1.5" y="1.5" width="837" height="337" rx="12.5" fill="none" stroke="#7D7D7D" stroke-width="1" stroke-dasharray="7 9" opacity="0.45">
      <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <!-- scan sweep -->
    <g clip-path="url(#plateClip)">
      <rect x="0" y="0" width="90" height="340" fill="url(#scan)">
        <animateTransform attributeName="transform" type="translate" from="-120 0" to="870 0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- border -->
    <rect x="0" y="0" width="840" height="340" rx="14" fill="none" stroke="#3D3D3D" stroke-width="1.5"/>
  </g>
</svg>
