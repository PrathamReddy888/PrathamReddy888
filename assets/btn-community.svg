<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="64" viewBox="0 0 260 64" role="img" aria-label="CP community on X button">
  <defs>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="'Cascadia Mono','JetBrains Mono',Consolas,Menlo,monospace">
    <rect x="5" y="5" width="250" height="54" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2.5"/>
    <rect x="5" y="5" width="250" height="54" rx="16" fill="none" stroke="#00FFFF" stroke-width="1.5" stroke-dasharray="46 534" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="0" to="-580" dur="7s" begin="2.33s" repeatCount="indefinite"/>
    </rect>
    <circle cx="25" cy="23" r="3" fill="#00FFFF" filter="url(#neon)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="28" font-size="12.5" font-weight="bold" letter-spacing="1.5" fill="#EDEDF0">CP COMMUNITY ON X</text>
    <text x="40" y="45" font-size="8.5" letter-spacing="1.5" fill="#8A8A93">JOIN THE CHANNEL</text>
    <text x="231" y="32" text-anchor="end" font-size="13" font-weight="bold" fill="#00FFFF">▸</text>
  </g>
</svg>
