<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="394" viewBox="0 0 850 394" role="img" aria-label="Stack matrix, six languages and five tools">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#191A20" stroke-width="1" stroke-dasharray="7 19"/>
    </pattern>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.93  0 0 0 0 0.95  0 0 0 0.05 0"/>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00FFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00FFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00FFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plateClip"><rect x="5" y="5" width="840" height="384" rx="24"/></clipPath>
    <clipPath id="tkClip"><rect x="37" y="354" width="776" height="24"/></clipPath>
  </defs>
  <g font-family="'Cascadia Mono','JetBrains Mono',Consolas,Menlo,monospace">
    <rect x="5" y="5" width="840" height="384" rx="24" fill="#0D0D0F"/>
    <g clip-path="url(#plateClip)">
      <rect x="5" y="5" width="840" height="384" fill="url(#grid)"/>
      <rect x="5" y="5" width="840" height="384" filter="url(#grain)"/>
    </g>
    <rect x="8" y="8" width="834" height="378" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="10"/>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.9s" fill="freeze"/>
      <!-- languages header -->
      <g font-family="'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif">
        <text x="29" y="46" font-size="17" letter-spacing="2" fill="#EDEDF0">LANGUAGE CORE</text>
      </g>
      <text x="821" y="43" text-anchor="end" font-size="9" letter-spacing="2" fill="#8A8A93">06 UNITS</text>
      <rect x="29" y="58" width="792" height="1" fill="#1E1E24"/>
      <!-- python -->
      <rect x="29" y="72" width="256" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <g font-family="'Segoe UI Black','Arial Black',Arial,sans-serif"><text x="45" y="112" font-size="16" letter-spacing="1.5" fill="#EDEDF0">PYTHON</text></g>
      <text x="45" y="128" font-size="8" letter-spacing="1" fill="#8A8A93">ML CORE</text>
      <rect x="45" y="126" width="224" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <!-- typescript -->
      <rect x="297" y="72" width="256" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <g font-family="'Segoe UI Black','Arial Black',Arial,sans-serif"><text x="313" y="112" font-size="16" letter-spacing="1.5" fill="#EDEDF0">TYPESCRIPT</text></g>
      <text x="313" y="128" font-size="8" letter-spacing="1" fill="#8A8A93">APPS</text>
      <rect x="313" y="126" width="224" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <!-- rust -->
      <rect x="565" y="72" width="256" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <g font-family="'Segoe UI Black','Arial Black',Arial,sans-serif"><text x="581" y="112" font-size="16" letter-spacing="1.5" fill="#EDEDF0">RUST</text></g>
      <text x="581" y="128" font-size="8" letter-spacing="1" fill="#8A8A93">SYSTEMS</text>
      <rect x="581" y="126" width="224" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <!-- javascript -->
      <rect x="29" y="152" width="256" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <g font-family="'Segoe UI Black','Arial Black',Arial,sans-serif"><text x="45" y="192" font-size="16" letter-spacing="1.5" fill="#EDEDF0">JAVASCRIPT</text></g>
      <text x="45" y="208" font-size="8" letter-spacing="1" fill="#8A8A93">SCRIPTING</text>
      <rect x="45" y="206" width="224" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <!-- html -->
      <rect x="297" y="152" width="256" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <g font-family="'Segoe UI Black','Arial Black',Arial,sans-serif"><text x="313" y="192" font-size="16" letter-spacing="1.5" fill="#EDEDF0">HTML</text></g>
      <text x="313" y="208" font-size="8" letter-spacing="1" fill="#8A8A93">STRUCTURE</text>
      <rect x="313" y="206" width="224" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <!-- css -->
      <rect x="565" y="152" width="256" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <g font-family="'Segoe UI Black','Arial Black',Arial,sans-serif"><text x="581" y="192" font-size="16" letter-spacing="1.5" fill="#EDEDF0">CSS</text></g>
      <text x="581" y="208" font-size="8" letter-spacing="1" fill="#8A8A93">STYLE</text>
      <rect x="581" y="206" width="224" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <!-- tools header -->
      <g font-family="'Segoe UI Black','Arial Black',Arial,sans-serif">
        <text x="29" y="252" font-size="17" letter-spacing="2" fill="#EDEDF0">TOOLING</text>
      </g>
      <text x="821" y="249" text-anchor="end" font-size="9" letter-spacing="2" fill="#8A8A93">05 UNITS</text>
      <rect x="29" y="264" width="792" height="1" fill="#1E1E24"/>
      <!-- pytorch -->
      <rect x="29" y="278" width="148" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <text x="43" y="316" font-size="12.5" font-weight="bold" letter-spacing="1" fill="#EDEDF0">PYTORCH</text>
      <text x="43" y="332" font-size="7.5" letter-spacing="1" fill="#8A8A93">DEEP LEARNING</text>
      <rect x="43" y="332" width="120" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
      <!-- react -->
      <rect x="189" y="278" width="148" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <text x="203" y="316" font-size="12.5" font-weight="bold" letter-spacing="1" fill="#EDEDF0">REACT</text>
      <text x="203" y="332" font-size="7.5" letter-spacing="1" fill="#8A8A93">INTERFACES</text>
      <rect x="203" y="332" width="120" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" begin="2.1s" repeatCount="indefinite"/>
      </rect>
      <!-- nextjs -->
      <rect x="349" y="278" width="148" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <text x="363" y="316" font-size="12.5" font-weight="bold" letter-spacing="1" fill="#EDEDF0">NEXT.JS</text>
      <text x="363" y="332" font-size="7.5" letter-spacing="1" fill="#8A8A93">FULL STACK</text>
      <rect x="363" y="332" width="120" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <!-- nodejs -->
      <rect x="509" y="278" width="148" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <text x="523" y="316" font-size="12.5" font-weight="bold" letter-spacing="1" fill="#EDEDF0">NODE.JS</text>
      <text x="523" y="332" font-size="7.5" letter-spacing="1" fill="#8A8A93">RUNTIME</text>
      <rect x="523" y="332" width="120" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" begin="2.7s" repeatCount="indefinite"/>
      </rect>
      <!-- git -->
      <rect x="669" y="278" width="148" height="66" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
      <text x="683" y="316" font-size="12.5" font-weight="bold" letter-spacing="1" fill="#EDEDF0">GIT</text>
      <text x="683" y="332" font-size="7.5" letter-spacing="1" fill="#8A8A93">VERSIONING</text>
      <rect x="683" y="332" width="120" height="2" fill="url(#wave)">
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.12;0.45" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- manifest ticker, seamless -->
    <rect x="29" y="350" width="792" height="30" rx="10" fill="#0A0910" stroke="#2A2A2F" stroke-width="1.5"/>
    <g clip-path="url(#tkClip)">
      <g>
        <text x="37" y="371" font-size="9.5" letter-spacing="1.5" fill="#5A5A63" textLength="776" lengthAdjust="spacingAndGlyphs">MANIFEST // PYTHON · TYPESCRIPT · RUST · JAVASCRIPT · HTML · CSS · PYTORCH · REACT · NEXT.JS · NODE.JS · GIT //</text>
        <text x="813" y="371" font-size="9.5" letter-spacing="1.5" fill="#5A5A63" textLength="776" lengthAdjust="spacingAndGlyphs">MANIFEST // PYTHON · TYPESCRIPT · RUST · JAVASCRIPT · HTML · CSS · PYTORCH · REACT · NEXT.JS · NODE.JS · GIT //</text>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-776 0" dur="26s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- atmospheric sweep -->
    <g clip-path="url(#plateClip)">
      <rect x="0" y="5" width="130" height="384" fill="url(#scan)">
        <animateTransform attributeName="transform" type="translate" from="-160 0" to="870 0" dur="11s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="5" y="5" width="840" height="384" rx="24" fill="none" stroke="#2A2A2F" stroke-width="3"/>
    <path d="M 845 29 L 845 365 A 24 24 0 0 1 821 389 L 29 389" fill="none" stroke="url(#rim)" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
