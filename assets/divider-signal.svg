<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="68" viewBox="0 0 840 68" role="img" aria-label="Section 04, The Signal">
  <defs>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="'Cascadia Mono','JetBrains Mono',Consolas,Menlo,monospace">
    <rect x="0" y="31" width="840" height="1.5" fill="#2A2A2F"/>
    <line x1="0" y1="31.75" x2="840" y2="31.75" stroke="#00FFFF" stroke-width="2" stroke-dasharray="110 730" opacity="0.14">
      <animate attributeName="stroke-dashoffset" from="0" to="-840" dur="5s" begin="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="31.75" x2="840" y2="31.75" stroke="#00FFFF" stroke-width="2" stroke-dasharray="24 816" opacity="0.85" filter="url(#neon)">
      <animate attributeName="stroke-dashoffset" from="0" to="-840" dur="5s" begin="3.2s" repeatCount="indefinite"/>
    </line>
    <rect x="0" y="10" width="272" height="48" rx="14" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
    <circle cx="24" cy="26" r="3" fill="#00FFFF" filter="url(#neon)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="30" font-size="13" font-weight="bold" letter-spacing="2" fill="#EDEDF0">04 — THE SIGNAL</text>
    <text x="38" y="47" font-size="8" letter-spacing="1.5" fill="#8A8A93">OPEN CHANNELS · LINKS BELOW</text>
    <circle cx="716" cy="32" r="2.5" fill="#00FFFF">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <text>
    <text x="840" y="36" text-anchor="end" font-size="9" letter-spacing="2" fill="#5A5A63">03 CHANNELS</text>
  </g>
</svg>
