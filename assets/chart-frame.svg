<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="673" height="74" viewBox="0 0 673 74" role="img" aria-label="Daily contributions frame">
  <defs>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="'Cascadia Mono','JetBrains Mono',Consolas,Menlo,monospace">
    <rect x="5" y="5" width="663" height="64" rx="16" fill="#131317" stroke="#2A2A2F" stroke-width="2"/>
    <rect x="8" y="8" width="657" height="58" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="8"/>
    <text x="25" y="36" font-size="11" font-weight="bold" letter-spacing="2" fill="#EDEDF0">DAILY CONTRIBUTIONS</text>
    <circle cx="470" cy="32" r="3" fill="#C0FF00" filter="url(#neon)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="658" y="36" text-anchor="end" font-size="8.5" letter-spacing="1.5" fill="#8A8A93">LAST 12 MONTHS · LIVE</text>
    <line x1="25" y1="50" x2="658" y2="50" stroke="#2A2A2F" stroke-width="1.5" stroke-dasharray="5 7"/>
  </g>
</svg>
