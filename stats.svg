<svg width="420" height="160" viewBox="0 0 420 160"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Total GitHub contributions">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b9098" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8b9098" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <style>
    .label { font: 600 11px 'JetBrains Mono','Courier New',monospace; fill: #8b9098;
              letter-spacing: 3px; text-transform: uppercase; }
    .stat  { font: 700 40px 'Archivo Black','Arial Narrow',Impact,sans-serif; fill: #e7e9ec; }
    .sub   { font: 400 12px 'JetBrains Mono','Courier New',monospace; fill: #8b9098;
              letter-spacing: 1px; }
  </style>
  <rect x="0.5" y="0.5" width="419" height="159"
        fill="#0d0e10" stroke="#3d3f45"/>
  <rect x="0.5" y="0.5" width="140" height="159" fill="url(#fog)"/>
  <rect x="0" y="0" width="4" height="160" fill="#dcb27c"/>
  <text x="28" y="34" class="label">PrathamReddy888 // site log</text>
  <text x="28" y="98" class="stat">725</text>
  <text x="28" y="124" class="sub">total contributions — all time</text>
</svg>